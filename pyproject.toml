[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "elixir-echo"
version = "0.1.0"
description = "圣水回响 (ElixirEcho), a replay-based imitation-learning research toolkit for Clash Royale."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=9.0",
]

[project.scripts]
elixir-echo = "elixir_echo.cli:main"
elixir-echo-source-inventory = "elixir_echo.provenance:main"

[tool.hatch.build.targets.wheel]
packages = ["src/elixir_echo"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
  "firstlight: requires an explicitly configured read-only FirstLight checkout",
]
